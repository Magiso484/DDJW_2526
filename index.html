<!DOCTYPE html> 
<html>
	<head>
		<script src="./js/main.js"></script>

			href="./styles/main.css">
		<title> Memory - Menú </title>
	</head>
	<body>
		<h1 id="title">Menú</h1>
		<div id="main-menu">

			<h2>Tria el mode de joc</h2>
			<button id="mode1" class="center"> Mode 1: Nivell Únic </button>

</html>
